[build]
  command = "npm run build"
  publish = "dist"

# SPA: qualquer rota não encontrada cai no index.html (o React cuida do
# roteamento no navegador). Este projeto não usa rotas hoje, mas evita
# problemas se isso mudar no futuro.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Impede que o site seja carregado dentro de um <iframe> em outro
    # domínio — mitiga ataques de clickjacking.
    X-Frame-Options = "DENY"
    # Impede que o navegador tente "adivinhar" o tipo de um arquivo
    # diferente do Content-Type declarado.
    X-Content-Type-Options = "nosniff"
    # Não vaza a URL completa como referrer ao navegar para outro site.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Desativa APIs sensíveis do navegador que este site não usa.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content-Security-Policy: o app só carrega scripts/estilos do próprio
    # domínio e fontes do Google Fonts, e só faz fetch para o próprio
    # backend (configurado via VITE_API_BASE_URL) e para a API do HIBP
    # (chamada apenas pelo backend, não pelo navegador — mas mantemos a
    # política restrita mesmo assim). Ajuste connect-src se o domínio do
    # backend mudar.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://*.onrender.com https://*.up.railway.app; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
