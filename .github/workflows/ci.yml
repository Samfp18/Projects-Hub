# IMPORTANTE: o GitHub só reconhece workflows dentro de .github/workflows/
# na RAIZ do repositório. Como este projeto vive numa subpasta do seu
# portfólio (ex: cofre-de-senhas/), copie este arquivo para
# .github/workflows/cofre-de-senhas-ci.yml na raiz do repositório —
# não dentro da pasta do projeto. Os filtros de "paths" abaixo já garantem
# que ele só roda quando algo dentro de cofre-de-senhas/ muda, então não
# interfere com outros projetos do mesmo repositório.

name: Cofre de Senhas — CI

on:
  push:
    branches: [main, master]
    paths:
      - "cofre-de-senhas/**"
  pull_request:
    paths:
      - "cofre-de-senhas/**"

jobs:
  secret-scan:
    name: Escaneamento de segredos vazados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rodar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cofre-de-senhas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cofre-de-senhas/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npm run test:e2e

  frontend:
    name: Frontend — testes, build e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cofre-de-senhas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cofre-de-senhas/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Auditoria de dependências (falha em vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high

  backend:
    name: Backend — testes e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cofre-de-senhas/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cofre-de-senhas/server/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Auditoria de dependências (falha em vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high
